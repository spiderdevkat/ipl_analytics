version: 2

models:
  - name: stg_matches
    description: "Cleaned match-level data with fixed season formats and nulls"
    columns:
      - name: match_id
        description: "Unique match identifier"
        data_tests:
          - unique
          - not_null
      - name: season
        description: "IPL season as 4-digit year"
        data_tests:
          - not_null
          - accepted_values:
              values: ['2008','2009','2010','2011','2012','2013',
                       '2014','2015','2016','2017','2018','2019',
                       '2020','2021','2022','2023','2024']
      - name: toss_decision
        data_tests:
          - accepted_values:
              values: ['bat', 'field']

  - name: stg_deliveries
    description: "Cleaned ball-by-ball data with phase, boundaries, dot balls"
    columns:
      - name: match_id
        description: "Foreign key to stg_matches"
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_matches')
              field: match_id
      - name: inning
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
      - name: is_wicket
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: phase
        data_tests:
          - not_null
          - accepted_values:
              values: ['Powerplay', 'Middle', 'Death']